  --accent: #93A3F2; --accent-ink: #12141B; --accent-soft: #252C4B;

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: 12.5px; }

.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side); color: var(--side-ink); padding-block: 20px; padding-inline: 14px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding-inline: 6px; }
.mark { width: 34px; height: 34px; border-radius: 8px; flex: none;
  background: repeating-linear-gradient(-45deg, var(--soga) 0 5px, transparent 5px 8px, var(--soga) 8px 10px, transparent 10px 15px), #2A1D12; border: 1px solid #5A3B1E; }
.brand b { font-family: var(--f-display); font-weight: 600; font-size: 17px; letter-spacing: .01em; display: block; line-height: 1.15; }
.brand span { font-size: 11.5px; color: var(--side-muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { all: unset; cursor: pointer; padding: 9px 10px; border-radius: 8px; color: var(--side-ink); display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; }
.nav button:hover { background: var(--side-active); }
.nav button[aria-current="page"] { background: var(--side-active); color: #FFFFFF; box-shadow: inset 3px 0 0 var(--soga); }
.nav button:focus-visible { outline: 2px solid var(--accent); }
.nav .count { font-size: 11px; background: #B32A1E; color: #fff; border-radius: 99px; padding: 0 7px; line-height: 18px; }
.side-foot { margin-top: auto; font-size: 11.5px; color: var(--side-muted); padding-inline: 6px; line-height: 1.5; }

main { min-width: 0; padding-inline: 28px; padding-block: 0 48px; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding-block: 20px 18px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
.top h1 { font-family: var(--f-display); font-weight: 600; font-size: 24px; margin: 0; text-wrap: balance; }
.top .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.top-right { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--soga-soft); color: var(--soga); font-weight: 500; white-space: nowrap; }
.seg { display: inline-flex; background: var(--sunk); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
.seg button { all: unset; cursor: pointer; padding: 5px 12px; border-radius: 7px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 500; }
.seg button:focus-visible { outline: 2px solid var(--accent); }
.seg-label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); }

.proto { font-size: 12.5px; color: var(--muted); background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; margin-bottom: 20px; }
.proto b { color: var(--ink); font-weight: 500; }

.grid { display: grid; gap: 16px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .l { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.kpi .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi .s { font-size: 12.5px; color: var(--muted); }
.neg { color: var(--crit); }
.pos { color: var(--good); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; min-width: 0; }
.panel h2 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
.panel .hint { color: var(--muted); font-size: 12.5px; margin: 0 0 14px; }
.two { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }

.chart svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

.costs { display: flex; flex-direction: column; gap: 12px; }
.cost-row { display: grid; grid-template-columns: 116px minmax(0, 1fr) 54px; gap: 10px; align-items: center; font-size: 13px; }
.cost-row .bar { position: relative; height: 10px; background: var(--sunk); border-radius: 99px; }
.cost-row .bar span { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--accent); }
.cost-row .bar span.over { background: var(--crit); }
.cost-row .bar em { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); opacity: .55; }
.cost-row .p { text-align: right; font-variant-numeric: tabular-nums; }

.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.checks li { display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
.dot { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; flex: none; font-weight: 700; }
.dot.ok { background: var(--good-soft); color: var(--good); }
.dot.bad { background: var(--crit-soft); color: var(--crit); }

.pill { display: inline-block; font-size: 11.5px; font-weight: 500; padding: 1px 8px; border-radius: 99px; white-space: nowrap; }
.pill.ok { background: var(--good-soft); color: var(--good); }
.pill.wait { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--crit-soft); color: var(--crit); }
.pill.auto { background: var(--accent-soft); color: var(--accent); }
.pill.adj { background: var(--soga-soft); color: var(--soga); }
.pill.tag { background: var(--sunk); color: var(--muted); }

.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 16px; scrollbar-width: thin; }
.tabs button { all: unset; cursor: pointer; padding: 8px 12px; font-size: 13.5px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--accent); font-weight: 500; }
.tabs button:focus-visible { outline: 2px solid var(--accent); }

.months { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 14px; }
.months button { all: unset; cursor: pointer; font-size: 12.5px; padding: 4px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.months button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.months button.locked::after { content: " ·"; }
.months button:focus-visible { outline: 2px solid var(--accent); }

.sumstrip { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-bottom: 16px; font-size: 13px; color: var(--muted); }
.sumstrip b { display: block; color: var(--ink); font-size: 16px; font-variant-numeric: tabular-nums; }

.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal .wd { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); text-align: center; padding-bottom: 2px; }
.day { all: unset; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px 8px; min-height: 62px; display: flex; flex-direction: column; gap: 2px; position: relative; overflow: hidden; }
.day:hover { border-color: var(--accent); }
.day:focus-visible { outline: 2px solid var(--accent); }
.day .n { font-size: 12px; color: var(--muted); }
.day .a { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.day::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: transparent; }
.day.s-ok::after { background: var(--good); }
.day.s-wait::after { background: var(--warn); }
.day.s-bad::after { background: var(--crit); }
.day.empty { background: transparent; border-style: dashed; }
.day.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.day.today .n { color: var(--accent); font-weight: 700; }
.cal-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 10px; }
.cal-legend i { display: inline-block; width: 12px; height: 3px; margin-right: 6px; vertical-align: 3px; }

form.f { display: flex; flex-direction: column; gap: 14px; }
fieldset { border: 0; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
legend { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; padding: 0; }
label.fld { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); min-width: 0; }
.fld input, .fld select { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; color: var(--ink); font-size: 14px; width: 100%; min-width: 0; }
.fld input:disabled, .fld select:disabled { background: var(--sunk); color: var(--muted); }
.fld input.money { text-align: right; font-variant-numeric: tabular-nums; }
.wide { grid-column: 1 / -1; }
.calc { background: var(--sunk); border-radius: 8px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; }
.calc span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; }
.calc .big { font-weight: 600; font-size: 14.5px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { all: unset; cursor: pointer; background: var(--accent); color: var(--accent-ink); padding: 8px 14px; border-radius: 8px; font-weight: 500; font-size: 13.5px; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }

.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }

.t .ket { min-width: 240px; color: var(--ink); }
.t .acc { white-space: nowrap; }
.rep td:first-child, .rep th:first-child { position: sticky; left: 0; background: var(--surface); min-width: 220px; }

.more { display: flex; justify-content: center; padding: 12px; }

.steps { counter-reset: s; display: flex; flex-direction: column; gap: 14px; }
.step { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; }
.step::before { counter-increment: s; content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 600; font-size: 13px; }
.step h3 { margin: 2px 0 6px; font-size: 14px; }
.daylist { display: flex; flex-wrap: wrap; gap: 6px; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; }
.check input { margin-top: 3px; }

.kasir { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
.setor-row { display: grid; grid-template-columns: 90px minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; align-items: end; padding-block: 10px; border-top: 1px solid var(--line); }
.setor-row:first-of-type { border-top: 0; }

#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 9px; font-size: 13.5px; box-shadow: 0 6px 20px rgba(0,0,0,.25); z-index: 10; max-width: calc(100% - 32px); }

@media (max-width: 900px) {
  .two { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; z-index: 5; padding-block: 10px; padding-inline: 16px; gap: 10px; }
  .nav { flex-direction: row; overflow-x: auto; gap: 4px; scrollbar-width: none; }
  .nav button { white-space: nowrap; padding: 7px 10px; }

  main { padding-inline: 16px; }
  .top h1 { font-size: 21px; }
  .day { min-height: 52px; padding: 4px 5px 6px; }
  .day .a { font-size: 11px; }
  .setor-row { grid-template-columns: 1fr 1fr; }
  .setor-row .dl { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<script>
/* Mesin hitung Kopi Parang — terjemahan rumus Excel v2 (lihat dokumen spesifikasi, bagian Logika perhitungan) */
const N = v => (typeof v === 'number' && isFinite(v)) ? v : 0;
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BLN3 = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

function calcDay(r) {
  const tot = N(r.c) + N(r.e);
  const noShift = r.s1 == null && r.s2 == null;
  const cdiff = noShift ? 0 : N(r.c) - N(r.s1) - N(r.s2);
  const ediff = r.es == null ? 0 : N(r.e) - N(r.es);
  const unexp = noShift ? 0 : cdiff - N(r.bon) - N(r.comp) - N(r.own);
  const cost = ediff + unexp;
  const net = tot - cost;
  let st = '';
  if (tot === 0) st = '';
  else if (N(r.c) > 0 && noShift) st = 'Belum direalisasi';
  else if (N(r.e) > 0 && r.es == null) st = 'EDC belum settle';
  else if (Math.abs(unexp) > 50000) st = 'Cek selisih tunai';
  else st = 'OK';
  return { tot, real: N(r.s1) + N(r.s2) + N(r.es), cdiff, ediff, unexp, cost, net, st,
           ticket: N(r.trx) ? net / N(r.trx) : null };
}

function lastDay(y, m) { return new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10); }

function compute(st) {
  const { year: Y, rate, inkl, accr } = st.settings;
  const BLN = st.bln;
  const acc = st.accounts.map(a => ({ code: a[0], name: a[1], group: a[2], normal: a[3], cat: a[4], line: a[5], ob: a[6] }));
  const A = Object.fromEntries(acc.map(a => [a.name, a]));
  const eq = acc.filter(a => a.group === 'ASET' && a.normal === 'D').reduce((s, a) => s + a.ob, 0)
           - acc.filter(a => a.group === 'ASET' && a.normal === 'K').reduce((s, a) => s + a.ob, 0)
           - acc.filter(a => a.group === 'LIABILITAS').reduce((s, a) => s + a.ob, 0);
  A['Ekuitas Kopi Parang'].ob = eq;

  // omzet harian
  const days = st.daily.map(r => ({ ...r, m: +r.d.slice(5, 7), x: calcDay(r) }));
  const ms = Array.from({ length: 13 }, () => ({ tot: 0, cash: 0, edc: 0, net: 0, real: 0, s: 0, es: 0, bon: 0, comp: 0, own: 0, cdiff: 0, unexp: 0, ediff: 0, items: 0, trx: 0, open: 0, notok: 0 }));
  for (const r of days) {
    const o = ms[r.m], x = r.x;
    o.tot += x.tot; o.cash += N(r.c); o.edc += N(r.e); o.net += x.net; o.real += x.real;
    o.s += N(r.s1) + N(r.s2); o.es += N(r.es); o.bon += N(r.bon); o.comp += N(r.comp); o.own += N(r.own);
    o.cdiff += x.cdiff; o.unexp += x.unexp; o.ediff += x.ediff; o.items += N(r.items); o.trx += N(r.trx);
    if (x.tot > 0) { o.open++; if (x.st !== 'OK') o.notok++; }
  }

  // penyusutan
  const assets = st.assets.map(a => {
    const [y, mo] = a[1].split('-').map(Number);
    const sy = mo === 12 ? y + 1 : y, sm = mo === 12 ? 1 : mo + 1;
    const per = Math.round(a[2] / (a[3] * 12));
    const sched = [0];
    for (let m = 1; m <= 12; m++) {
      const idx = (Y - sy) * 12 + (m - sm);
      sched.push(m <= BLN && idx >= 0 && idx < a[3] * 12 ? per : 0);
    }
    const akum = sched.reduce((s, v) => s + v, 0);
    return { name: a[0], date: a[1], cost: a[2], life: a[3], per, start: `${sy}-${String(sm).padStart(2, '0')}-01`, sched, akum, book: a[2] - akum };
  });
  const dep = m => assets.reduce((s, a) => s + a.sched[m], 0);

  // PBJT
  const pbjt = m => {
    const om = ms[m].tot;
    const dpp = inkl ? om / (1 + rate) : om;
    const ter = Math.round(dpp * rate);
    return { om, ter, kb: ter - N(st.paid[m]) };
  };

  // jurnal otomatis
  const auto = [];
  for (let m = 1; m <= BLN; m++) {
    const d = lastDay(Y, m), o = ms[m], nm = BULAN[m - 1];
    const push = (deb, kre, nom, ket, kind = 'OTOMATIS', sub = '') => { if (nom) auto.push({ no: `AUTO-${String(m).padStart(2, '0')}-${auto.length + 1}`, d, m, y: Y, deb, kre, nom, ket, tag: '', sub, kind }); };
    push('Piutang Usaha Cafe', 'Pendapatan Cafe', o.net, `Omzet bersih bulan ${nm} (dari Omzet Harian)`);
    push('Kas Tunai', 'Piutang Usaha Cafe', o.s, `Realisasi tunai omzet bulan ${nm}`);
    push('Kas Bank', 'Piutang Usaha Cafe', o.es, `Realisasi EDC/QRIS omzet bulan ${nm}`);
    push('Piutang Lainnya', 'Piutang Usaha Cafe', o.bon, `Bon karyawan bulan ${nm}`);
    push('Biaya Compliment', 'Piutang Usaha Cafe', o.comp, `Compliment bulan ${nm}`);
    push('Prive', 'Piutang Usaha Cafe', o.own, `Bill owner bulan ${nm}`, 'OTOMATIS', 'Bill Owner');
    push('Beban Penyusutan Peralatan', 'Akumulasi Penyusutan Peralatan', dep(m), `Penyusutan peralatan bulan ${nm}`);
    if (accr) push('Pajak Restoran', 'Utang Pajak Daerah (PBJT)', Math.max(0, pbjt(m).kb), `Estimasi PBJT kurang bayar bulan ${nm}`, 'PENYESUAIAN');
  }
  const manual = st.journal.map(j => ({ no: j[0], d: j[1], m: +j[1].slice(5, 7), y: +j[1].slice(0, 4), deb: j[2], kre: j[3], nom: j[4], ket: j[5], tag: j[6], sub: j[7], nota: j[8] || '', kind: 'UMUM' }));

  // Penyesuaian persediaan dari nilai stok akhir Parang-ops (jurnal 9, spesifikasi bagian 2).
  // Hanya dibuat untuk bulan yang punya ops[m].stock; Jan–Sep 2026 tidak punya, jadi angka patokan tetap.
  const ops = st.ops || {};
  const INV = 'Inventori', BB = 'Biaya Bahan Baku';
  const invBase = Array(13).fill(0);
  for (const j of manual.concat(auto)) {
    if (j.y !== Y) continue;
    if (j.deb === INV) invBase[j.m] += j.nom;
    if (j.kre === INV) invBase[j.m] -= j.nom;
  }
  let invRun = A[INV].ob;
  for (let m = 1; m <= BLN; m++) {
    invRun += invBase[m];
    const sv = ops[m] && ops[m].stock;
    if (sv == null) continue;
    const adj = Math.round(sv - invRun);
    if (adj) {
      auto.push({ no: `AUTO-${String(m).padStart(2, '0')}-INV`, d: lastDay(Y, m), m, y: Y, deb: adj > 0 ? INV : BB, kre: adj > 0 ? BB : INV, nom: Math.abs(adj),
        ket: `Penyesuaian persediaan bulan ${BULAN[m - 1]} (nilai stok Parang-ops ${sv.toLocaleString('id-ID')})`, tag: '', sub: '', kind: 'PENYESUAIAN', inv: true });
      invRun += adj;
    }
  }
  const all = manual.concat(auto).filter(j => j.y === Y);

  // mutasi
  const mut = Object.fromEntries(acc.map(a => [a.name, Array(13).fill(0)]));
  for (const j of all) { mut[j.deb][j.m] += j.nom; mut[j.kre][j.m] -= j.nom; }
  const sob = n => A[n].normal === 'D' ? A[n].ob : -A[n].ob;
  const upto = (n, M = BLN) => mut[n].slice(1, M + 1).reduce((s, v) => s + v, 0);
  const end = n => sob(n) + upto(n);

  // laba rugi
  const pl = [null];
  for (let m = 1; m <= 12; m++) {
    const g = n => mut[n][m];
    const cafe = -g('Pendapatan Cafe'), non = -g('Pendapatan non Cafe'), kotor = cafe + non, pajak = g('Pajak Restoran'), net = kotor - pajak;
    const bb = g('Biaya Bahan Baku'), saji = g('Biaya Penyajian'), hpp = bb + saji, gross = net - hpp;
    const op = {};
    acc.filter(a => a.code.startsWith('61')).forEach(a => op[a.name] = g(a.name));
    const bu = Object.values(op).reduce((s, v) => s + v, 0);
    const usaha = gross - bu, ebitda = usaha + op['Beban Penyusutan Peralatan'];
    const lainP = -g('Pendapatan Lainnya'), lainB = g('Biaya Lainnya'), lain = lainP - lainB, np = usaha + lain;
    pl.push({ cafe, non, kotor, pajak, net, bb, saji, hpp, gross, op, bu, usaha, ebitda, lainP, lainB, lain, np });
  }
  const sumPL = k => pl.slice(1, BLN + 1).reduce((s, p) => s + p[k], 0);
  const plTot = {}; ['cafe','non','kotor','pajak','net','bb','saji','hpp','gross','bu','usaha','ebitda','lainP','lainB','lain','np'].forEach(k => plTot[k] = sumPL(k));
  plTot.op = {}; Object.keys(pl[1].op).forEach(k => plTot.op[k] = pl.slice(1, BLN + 1).reduce((s, p) => s + p.op[k], 0));

  // neraca
  const bal = (n, open) => open ? sob(n) : end(n);
  const nr = open => {
    const b = n => bal(n, open);
    const o = { kasT: b('Kas Tunai'), kasB: b('Kas Bank'), kasW: b('Kas Warung'), piut: b('Piutang Usaha Cafe') + b('Piutang Usaha non Cafe'), piutL: b('Piutang Lainnya'), inv: b('Inventori'), perl: b('Perlengkapan'), dimuka: b('Beban Dibayar di Muka'), alat: b('Peralatan'), akum: b('Akumulasi Penyusutan Peralatan') };
    o.al = o.kasT + o.kasB + o.kasW + o.piut + o.piutL + o.inv + o.perl + o.dimuka; o.atl = o.alat + o.akum; o.ta = o.al + o.atl;
    o.uu = -b('Utang Usaha Lancar'); o.upj = -b('Utang Pajak Daerah (PBJT)'); o.ul = -b('Utang Lainnya'); o.lp = o.uu + o.upj + o.ul; o.ujp = -b('Utang Usaha Jangka Panjang'); o.tl = o.lp + o.ujp;
    o.modal = -b('Ekuitas Kopi Parang'); o.prive = -b('Prive');
    o.lr = open ? 0 : -acc.filter(a => a.group === 'PENDAPATAN' || a.group === 'BEBAN').reduce((s, a) => s + upto(a.name), 0);
    o.te = o.modal + o.prive + o.lr; o.tle = o.tl + o.te; o.cek = Math.round(o.ta - o.tle);
    return o;
  };
  const neraca = { open: nr(true), close: nr(false) };

  // arus kas
  const lines = ['OP1','OP2','OP3','OP4','OP5','OP6','OP7','IN1','FN1','FN2','FN3'];
  const cf = Object.fromEntries(lines.map(l => [l, Array(13).fill(0)]));
  for (const j of all) {
    if (j.m > BLN) continue;
    const kd = A[j.deb].cat === 'KAS', kk = A[j.kre].cat === 'KAS';
    if (kd === kk) continue;
    const law = kd ? j.kre : j.deb, eff = kd ? j.nom : -j.nom, ln = A[law].line;
    j.cash = eff; j.lawan = law;
    if (cf[ln]) cf[ln][m_(j)] += eff;
  }
  function m_(j) { return j.m; }
  const kasAccts = acc.filter(a => a.cat === 'KAS').map(a => a.name);
  const kasAwal = kasAccts.reduce((s, n) => s + sob(n), 0);
  const cfm = [null]; let run = kasAwal;
  for (let m = 1; m <= BLN; m++) {
    const g = l => cf[l][m];
    const op = ['OP1','OP2','OP3','OP4','OP5','OP6','OP7'].reduce((s, l) => s + g(l), 0), inv = g('IN1'), fin = g('FN1') + g('FN2') + g('FN3');
    const awal = run, naik = op + inv + fin; run = awal + naik;
    cfm.push({ op, inv, fin, naik, awal, akhir: run });
  }
  const kasLedger = kasAccts.reduce((s, n) => s + end(n), 0);

  // perubahan ekuitas
  const pe = [null]; let ea = -(sob('Ekuitas Kopi Parang') + sob('Prive'));
  for (let m = 1; m <= BLN; m++) {
    const setor = -mut['Ekuitas Kopi Parang'][m], prive = -mut['Prive'][m], lb = pl[m].np;
    const akhir = ea + setor + lb + prive; pe.push({ awal: ea, setor, lb, prive, akhir }); ea = akhir;
  }

  // neraca saldo
  const ns = acc.map(a => { const s = end(a.name); return { ...a, end: s, dr: Math.max(s, 0), cr: Math.max(-s, 0) }; });
  const nsDiff = Math.round(ns.reduce((s, r) => s + r.dr - r.cr, 0));

  // event
  const tags = [...new Set(manual.map(j => j.tag).filter(Boolean))];
  const events = tags.map(t => {
    const js = manual.filter(j => j.tag === t);
    const pend = js.filter(j => A[j.kre].group === 'PENDAPATAN').reduce((s, j) => s + j.nom, 0);
    const biaya = js.filter(j => A[j.deb].group === 'BEBAN').reduce((s, j) => s + j.nom, 0);
    return { name: t, first: js.map(j => j.d).sort()[0], pend, biaya, laba: pend - biaya, ratio: pend ? biaya / pend : null, n: js.length };
  }).sort((a, b) => a.first.localeCompare(b.first));

  // Cek dengan Parang-ops (spesifikasi bagian 12). Tidak memblokir tutup buku.
  const tolP = st.settings.tolP ?? 0.05, tolS = st.settings.tolS ?? 0.02;
  const opsCheck = [null];
  for (let m = 1; m <= 12; m++) {
    const o = ops[m] || {};
    const kPurch = manual.filter(j => j.y === Y && j.m === m && (j.deb === 'Biaya Bahan Baku' || j.deb === 'Biaya Penyajian')).reduce((s, j) => s + j.nom, 0);
    const dP = o.purch == null ? null : o.purch - kPurch;
    const dS = o.sales == null ? null : o.sales - ms[m].tot;
    opsCheck.push({ m, stock: o.stock ?? null, purch: o.purch ?? null, sales: o.sales ?? null, kPurch, omzet: ms[m].tot, dP, dS,
      flagP: dP != null && Math.abs(dP) > tolP * kPurch, flagS: dS != null && Math.abs(dS) > tolS * ms[m].tot });
  }

  const openDays = ms.slice(1, BLN + 1).reduce((s, o) => s + o.open, 0);
  const netYtd = ms.slice(1, BLN + 1).reduce((s, o) => s + o.net, 0);
  const trxYtd = ms.slice(1, BLN + 1).reduce((s, o) => s + o.trx, 0);

  const checks = [
    { label: 'Neraca seimbang', ok: neraca.close.cek === 0, diff: neraca.close.cek },
    { label: 'Neraca saldo seimbang', ok: nsDiff === 0, diff: nsDiff },
    { label: 'Kas di arus kas = kas di neraca', ok: BLN === 0 || Math.round(cfm[BLN].akhir - kasLedger) === 0, diff: BLN ? Math.round(cfm[BLN].akhir - kasLedger) : 0 },
    { label: 'Ekuitas: laporan perubahan = neraca', ok: BLN === 0 || Math.round(pe[BLN].akhir - neraca.close.te) === 0, diff: BLN ? Math.round(pe[BLN].akhir - neraca.close.te) : 0 },
  ];

  return { BLN, Y, acc, A, days, ms, assets, auto, manual, all, mut, sob, end, pl, plTot, neraca, cf, cfm, kasLedger, pe, ns, events, checks, pbjt, opsCheck, tolP, tolS,
           perDay: openDays ? netYtd / openDays : 0, ticket: trxYtd ? netYtd / trxYtd : 0 };
}

if (typeof module !== 'undefined') module.exports = { compute, calcDay, BULAN, BLN3 };

</script>
<script>
(function () {
const D = window.KP_DATA;
const TODAY = '2026-10-12';
const st = {
  settings: { ...D.settings, tolP: 0.05, tolS: 0.02 }, bln: D.settings.bln, accounts: D.accounts, assets: D.assets, paid: { ...D.paid }, reported: {},
  ops: {}, // angka bulanan dari Parang-ops, diinput manual saat tutup buku: { [bulan]: { stock, purch, sales } }
  daily: D.daily.map(r => ({ d: r[0], c: r[1], e: r[2], s1: r[3], s2: r[4], es: r[5], bon: r[6], comp: r[7], own: r[8], items: r[9], trx: r[10] })),
  journal: D.journal.slice(),
};
const LIM = { food: 0.35, pay: 0.30, occ: 0.10, prime: 0.65, net: 0.10 };
let R = compute(st);
const ui = { role: 'owner', view: 'dashboard', om: 10, sel: null, rep: 'lr', bb: 'Kas Bank', jf: { q: '', m: '', acct: '', ev: '', kind: '' }, jLimit: 60, jForm: false, jErr: '', confirmReopen: false, ack: {}, pinOk: false, pinErr: '' };
const DEMO_PIN = '123456';
const NAV = [
  { id: 'dashboard', label: 'Ringkasan', roles: ['owner', 'admin'] },
  { id: 'omzet', label: 'Omzet Harian', roles: ['owner', 'admin', 'kasir'] },
  { id: 'jurnal', label: 'Jurnal', roles: ['owner', 'admin'] },
  { id: 'laporan', label: 'Laporan', roles: ['owner', 'admin'] },
  { id: 'aset', label: 'Aset Tetap', roles: ['owner', 'admin'] },
  { id: 'tutup', label: 'Tutup Buku', roles: ['owner'] },
];
const ROLES = [['owner', 'Owner'], ['admin', 'Admin'], ['kasir', 'Kasir']];

/* ---------- format ---------- */
const nf = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 });
const f0 = n => nf.format(Math.round(n || 0));
const rp = n => (n < 0 ? '−Rp' : 'Rp') + nf.format(Math.abs(Math.round(n || 0)));
const acct = n => n == null || n === '' ? '' : (n < 0 ? '(' + nf.format(Math.abs(Math.round(n))) + ')' : nf.format(Math.round(n)));
const jt = n => { const v = n / 1e6; return (v < 0 ? '−' : '') + new Intl.NumberFormat('id-ID', { maximumFractionDigits: Math.abs(v) < 10 ? 2 : 1 }).format(Math.abs(v)) + ' jt'; };
const pct = (n, d = 1) => n == null || !isFinite(n) ? '–' : new Intl.NumberFormat('id-ID', { maximumFractionDigits: d, minimumFractionDigits: d }).format(n * 100) + '%';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tgl = d => { const [y, m, dd] = d.split('-').map(Number); return `${dd} ${BLN3[m - 1]} ${y}`; };
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const dow = d => new Date(d + 'T00:00:00Z').getUTCDay();
const periode = () => R.BLN ? `Periode 1 Januari – ${+lastDayStr(R.BLN).slice(8)} ${BULAN[R.BLN - 1]} ${R.Y}` : 'Belum ada bulan ditutup';
const lastDayStr = m => new Date(Date.UTC(R.Y, m, 0)).toISOString().slice(0, 10);
const parseMoney = v => { const s = String(v ?? '').replace(/[^\d-]/g, ''); return s === '' || s === '-' ? null : Number(s); };
const stClass = s => s === 'OK' ? 'ok' : s === 'Cek selisih tunai' ? 'bad' : s ? 'wait' : '';

/* ---------- shell ---------- */
function render() {
  const allowed = NAV.filter(n => n.roles.includes(ui.role));
  if (!allowed.find(n => n.id === ui.view)) ui.view = allowed[0].id;
  const oct = R.ms[ui.role === 'kasir' ? 10 : 10];
  document.getElementById('nav').innerHTML = allowed.map(n => {
    const badge = n.id === 'omzet' && R.ms[R.BLN + 1] && R.ms[R.BLN + 1].notok ? `<span class="count">${R.ms[R.BLN + 1].notok}</span>` : '';
    return `<button data-act="nav" data-v="${n.id}" ${ui.view === n.id ? 'aria-current="page"' : ''}>${n.label}${badge}</button>`;
  }).join('');
  const views = { dashboard: vDash, omzet: ui.role === 'kasir' ? vKasir : vOmzet, jurnal: vJurnal, laporan: vLaporan, aset: vAset, tutup: vTutup };
  const [title, sub, body] = ui.role === 'kasir' && !ui.pinOk ? vPin() : views[ui.view]();
  document.getElementById('main').innerHTML = `
    <header class="top">
      <div><h1>${title}</h1><div class="sub">${sub}</div></div>
      <div class="top-right">
        <span class="chip">Tutup buku s.d. ${R.BLN ? BULAN[R.BLN - 1] + ' ' + R.Y : '–'}</span>
        <span class="seg-label">Masuk sebagai</span>
        <div class="seg" role="group" aria-label="Peran">${ROLES.map(([k, l]) => `<button data-act="role" data-v="${k}" aria-pressed="${ui.role === k}">${l}</button>`).join('')}</div>
      </div>
    </header>
    <div class="proto"><b>Prototipe.</b> Angka di sini dihitung ulang dari data asli Excel v2 dan sama dengan Excel. Aplikasi ini berdiri sendiri: tidak terhubung ke Majoo maupun Parang-ops. Coba ganti peran, isi omzet, tambah jurnal, atau tutup buku Oktober. Perubahan hilang saat halaman dimuat ulang.</div>
    ${body}`;
}

/* ---------- dashboard ---------- */
function vDash() {
  const B = R.BLN, T = R.plTot;
  const nm = T.net ? T.np / T.net : null, gm = T.net ? T.gross / T.net : null;
  const next = R.ms[B + 1];
  const kpis = `<div class="kpis">
    ${kpi('Pendapatan bersih', rp(T.net), `rata-rata ${jt(T.net / B)} / bulan`)}
    ${kpi('Laba kotor', rp(T.gross), `margin ${pct(gm)}`)}
    ${kpi('Laba bersih', rp(T.np), `margin ${pct(nm)} · target ≥ ${pct(LIM.net, 0)}`, T.np < 0 ? 'neg' : 'pos')}
    ${kpi('Omzet bersih / hari', rp(R.perDay), 'rata-rata hari buka')}
    ${kpi('Rata-rata / transaksi', rp(R.ticket), 'avg ticket')}
  </div>`;
  const costs = [
    ['HPP (food cost)', T.hpp, LIM.food], ['Gaji', T.op['Beban Gaji'], LIM.pay], ['Sewa', T.op['Biaya Sewa Tempat'], LIM.occ],
    ['Marketing & event', T.op['Biaya Marketing & Promosi']], ['Tagihan bulanan', T.op['Biaya Tagihan Bulanan']],
    ['Beban lainnya', T.bu - T.op['Beban Gaji'] - T.op['Biaya Sewa Tempat'] - T.op['Biaya Marketing & Promosi'] - T.op['Biaya Tagihan Bulanan']],
  ];
  const costHtml = costs.map(([l, v, lim]) => {
    const p = v / T.net, over = lim && p > lim;
    return `<div class="cost-row"><span>${l}</span><div class="bar" title="${rp(v)}"><span class="${over ? 'over' : ''}" style="width:${Math.min(100, Math.max(0, p * 100 / 0.6))}%"></span>${lim ? `<em style="left:${lim * 100 / 0.6}%" title="batas ${pct(lim, 0)}"></em>` : ''}</div><span class="p ${over ? 'neg' : ''}">${pct(p)}</span></div>`;
  }).join('');
  const checks = `<ul class="checks">${R.checks.map(c => `<li><span class="dot ${c.ok ? 'ok' : 'bad'}">${c.ok ? '✓' : '!'}</span>${c.label}${c.ok ? '' : ` <span class="neg">selisih ${f0(c.diff)}</span>`}</li>`).join('')}</ul>`;
  const attn = next ? `<p class="note" style="margin-top:14px">${BULAN[B]} berjalan: ${next.open} hari buka, <b class="${next.notok ? 'neg' : ''}">${next.notok} hari perlu dicek</b> sebelum tutup buku.</p>` : '';
  return ['Ringkasan keuangan', periode(), `<div class="grid">
    ${kpis}
    <div class="two">
      <section class="panel chart"><h2>Kinerja bulanan</h2><p class="hint">Pendapatan bersih dan laba bersih per bulan yang sudah ditutup.</p>${chart()}</section>
      <div class="grid">
        <section class="panel"><h2>Struktur biaya</h2><p class="hint">Persen dari pendapatan bersih s.d. ${BULAN[B - 1]}. Garis tipis = batas di Pengaturan.</p><div class="costs">${costHtml}</div></section>
        <section class="panel"><h2>Cek kesehatan data</h2><p class="hint">Harus semua hijau sebelum laporan dibagikan.</p>${checks}${attn}</section>
      </div>
    </div>
    ${eventPanel()}
  </div>`];
}
function kpi(l, v, s, cls = '') { return `<div class="kpi"><span class="l">${l}</span><span class="v ${cls}">${v}</span><span class="s">${s}</span></div>`; }
function eventPanel() {
  const ev = R.events;
  return `<section class="panel"><h2>Hasil per event</h2><p class="hint">Dari jurnal yang diberi tag event. Biaya tanpa tag tidak ikut terhitung.</p>
    <div class="tw"><table class="t"><thead><tr><th>Event</th><th>Mulai</th><th class="r">Pendapatan</th><th class="r">Biaya</th><th class="r">Laba (rugi)</th></tr></thead><tbody>
    ${ev.map(e => `<tr><td>${esc(e.name.replace(/^Event /, ''))}</td><td class="acc">${tgl(e.first)}</td><td class="r">${f0(e.pend)}</td><td class="r">${f0(e.biaya)}</td><td class="r ${e.laba < 0 ? 'neg' : 'pos'}">${acct(e.laba)}</td></tr>`).join('')}
    </tbody></table></div></section>`;
}
function chart() {
  const B = R.BLN, W = 720, H = 300, L = 56, Rr = 12, Tp = 14, Bt = 30;
  const net = [], np = [];
  for (let m = 1; m <= B; m++) { net.push(R.pl[m].net); np.push(R.pl[m].np); }
  const step = 20e6;
  const max = Math.ceil(Math.max(...net, 0) / step) * step, min = Math.floor(Math.min(...np, 0) / step) * step;
  const y = v => Tp + (max - v) / (max - min) * (H - Tp - Bt);
  const bw = (W - L - Rr) / Math.max(B, 1), bar = Math.min(18, bw * 0.3);
  let g = '';
  for (let v = min; v <= max; v += step) g += `<line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v === 0 ? 'stroke-width="1.5" stroke="var(--faint)"' : ''}/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v === 0 ? '0' : (v / 1e6) + ' jt'}</text>`;
  let b = '';
  for (let i = 0; i < B; i++) {
    const cx = L + bw * i + bw / 2;
    const y0 = y(0), yn = y(net[i]), yp = y(np[i]);
    b += `<rect x="${cx - bar - 1}" y="${yn}" width="${bar}" height="${y0 - yn}" rx="2" fill="var(--accent)"><title>${BULAN[i]}: pendapatan bersih ${rp(net[i])}</title></rect>`;
    b += `<rect x="${cx + 1}" y="${Math.min(yp, y0)}" width="${bar}" height="${Math.abs(y0 - yp) || 1}" rx="2" fill="${np[i] < 0 ? 'var(--crit)' : 'var(--good)'}"><title>${BULAN[i]}: laba bersih ${rp(np[i])}</title></rect>`;
    b += `<text x="${cx}" y="${H - 10}" text-anchor="middle" font-size="11.5" fill="var(--muted)">${BLN3[i]}</text>`;
  }
  return `<div class="legend"><span><i style="background:var(--accent)"></i>Pendapatan bersih</span><span><i style="background:var(--good)"></i>Laba bersih</span><span><i style="background:var(--crit)"></i>Rugi bersih</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pendapatan bersih dan laba bersih per bulan">${g}${b}</svg>`;
}

/* ---------- omzet (admin/owner) ---------- */
function vOmzet() {
  const m = ui.om, o = R.ms[m], locked = m <= R.BLN;
  const days = R.days.filter(r => r.m === m);
  const first = dow(days[0].d), pad = (first + 6) % 7;
  let cells = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'].map(w => `<div class="wd">${w}</div>`).join('');
  for (let i = 0; i < pad; i++) cells += '<div></div>';
  for (const r of days) {
    const x = r.x, cls = x.tot ? 's-' + stClass(x.st) : 'empty';
    cells += `<button class="day ${cls} ${ui.sel === r.d ? 'sel' : ''} ${r.d === TODAY ? 'today' : ''}" data-act="day" data-v="${r.d}" aria-label="${tgl(r.d)} ${x.st || 'kosong'}"><span class="n">${+r.d.slice(8)}</span>${x.tot ? `<span class="a">${jt(x.net)}</span>` : ''}</button>`;
  }
  const months = BULAN.map((n, i) => `<button data-act="om" data-v="${i + 1}" aria-pressed="${ui.om === i + 1}" class="${i + 1 <= R.BLN ? 'locked' : ''}" title="${i + 1 <= R.BLN ? 'sudah ditutup' : ''}">${BLN3[i]}</button>`).join('');
  const target = st.settings.target;
  const strip = `<div class="sumstrip">
    <span>Omzet tercatat (POS)<b>${rp(o.tot)}</b></span><span>Omzet bersih<b>${rp(o.net)}</b></span>
    <span>Hari buka<b>${o.open}</b></span><span>Rata-rata / hari<b>${o.open ? rp(o.net / o.open) : '–'}</b></span>
    <span>Pencapaian target<b>${o.net ? pct(o.net / target) : '–'}</b></span><span>Perlu dicek<b class="${o.notok ? 'neg' : ''}">${o.notok} hari</b></span></div>`;

    const dr = j.deb === ui.bb ? j.nom : 0, cr = j.kre === ui.bb ? j.nom : 0; td += dr; tc += cr;
    bal += debN ? dr - cr : cr - dr;
    return `<tr><td class="acc">${tgl(j.d)}</td><td class="mono acc">${j.kind === 'UMUM' ? esc(j.no) : 'otomatis'}</td><td class="ket">${esc(j.ket)}</td><td class="acc">${esc(dr ? j.kre : j.deb)}</td><td class="r">${dr ? f0(dr) : ''}</td><td class="r">${cr ? f0(cr) : ''}</td><td class="r">${acct(bal)}</td></tr>`;
  }).join('');
  return `<div class="toolbar"><label class="fld" style="max-width:360px">Akun<select id="bb-acct" data-act="bb">${acctOptions(ui.bb)}</select></label>
    <div class="sumstrip" style="margin:0"><span>Saldo normal<b>${debN ? 'Debet' : 'Kredit'}</b></span><span>Total debet<b>${f0(td)}</b></span><span>Total kredit<b>${f0(tc)}</b></span><span>Saldo akhir<b>${acct(bal)}</b></span></div></div>
    <div class="tw"><table class="t rep"><thead><tr><th>Tanggal</th><th>No. bukti</th><th>Keterangan</th><th>Akun lawan</th><th class="r">Debet</th><th class="r">Kredit</th><th class="r">Saldo</th></tr></thead><tbody>
    <tr class="h"><td>1 Jan</td><td></td><td>Saldo awal</td><td></td><td></td><td></td><td class="r">${acct(a.ob)}</td></tr>${body}</tbody></table></div>`;
}

/* ---------- aset ---------- */
function vAset() {
  const as = R.assets, tc = as.reduce((s, a) => s + a.cost, 0), tk = as.reduce((s, a) => s + a.akum, 0);
  return ['Aset tetap', `${as.length} aset · garis lurus, mulai bulan setelah perolehan`, `
    <div class="tw"><table class="t rep"><thead><tr><th>Nama aset</th><th>Diperoleh</th><th class="r">Harga</th><th class="r">Masa (thn)</th><th>Mulai susut</th><th class="r">Per bulan</th><th class="r">Akum. s.d. ${BLN3[R.BLN - 1] || '–'}</th><th class="r">Nilai buku</th></tr></thead><tbody>
    ${as.map(a => `<tr><td>${esc(a.name)}</td><td class="acc">${tgl(a.date)}</td><td class="r">${f0(a.cost)}</td><td class="r">${a.life}</td><td class="acc">${tgl(a.start)}</td><td class="r">${f0(a.per)}</td><td class="r">${f0(a.akum)}</td><td class="r">${f0(a.book)}</td></tr>`).join('')}
    <tr class="grand"><td>Total</td><td></td><td class="r">${f0(tc)}</td><td></td><td></td><td></td><td class="r">${f0(tk)}</td><td class="r">${f0(tc - tk)}</td></tr></tbody></table></div>
    <p class="note" style="margin-top:10px">Penyusutan per bulan masuk ke jurnal otomatis saat tutup buku. Aset sebelum 2026 belum diinventarisasi.</p>`];
}

/* ---------- tutup buku ---------- */
function opsHistory() {
  const rows = [];
  for (let m = 1; m <= Math.min(12, R.BLN + 1); m++) {
    const o = R.opsCheck[m];
    const v = x => x == null ? '<span class="note">–</span>' : f0(x);
    const d = (x, flag) => x == null ? '<span class="note">–</span>' : `<span class="${flag ? 'neg' : ''}">${acct(x)}${flag ? ' !' : ''}</span>`;
    rows.push(`<tr><td>${BLN3[m - 1]}${m > R.BLN ? ' <span class="pill wait">berjalan</span>' : ''}</td><td class="r">${v(o.stock)}</td><td class="r">${v(o.purch)}</td><td class="r">${f0(o.kPurch)}</td><td class="r">${d(o.dP, o.flagP)}</td><td class="r">${v(o.sales)}</td><td class="r">${f0(o.omzet)}</td><td class="r">${d(o.dS, o.flagS)}</td></tr>`);
  }
  return `<section class="panel"><h2>Riwayat cek dengan Parang-ops</h2><p class="hint">Angka Parang-ops diinput manual saat tutup buku. Jan–Sep kosong karena belum ada data. Tanda ! = melewati toleransi (pembelian ${pct(R.tolP, 0)}, omzet ${pct(R.tolS, 0)}).</p>
    <div class="tw"><table class="t rep"><thead><tr><th>Bulan</th><th class="r">Nilai stok (Ops)</th><th class="r">Pembelian (Ops)</th><th class="r">Pembelian (Keuangan)</th><th class="r">Selisih</th><th class="r">Penjualan (Ops)</th><th class="r">Omzet tercatat</th><th class="r">Selisih</th></tr></thead><tbody>${rows.join('')}</tbody></table></div></section>`;
}
function vTutup() {
  const next = R.BLN + 1;
  if (next > 12) return ['Tutup buku', 'Tahun buku sudah ditutup seluruhnya', '<p class="note">Semua bulan sudah ditutup.</p>' + opsHistory()];
  const days = R.days.filter(r => r.m === next && r.x.tot && r.x.st !== 'OK');
  const prev = compute({ ...st, bln: next });
  const autos = prev.auto.filter(j => j.m === next);
  const o = st.ops[next] || {}, oc = prev.opsCheck[next];
  const opsOk = o.stock != null && o.purch != null;
  const ackDays = !days.length || ui.ack.days, ready = ui.ack.rutin && ackDays && opsOk;
  const need = [!ui.ack.rutin && 'centang tagihan rutin', !ackDays && 'konfirmasi hari yang belum OK', !opsOk && 'isi nilai stok dan pembelian dari Parang-ops'].filter(Boolean);
  const cmp = opsOk ? `<div class="calc" style="margin-top:10px">
      <span>Pembelian Parang-ops</span><span>${f0(oc.purch)}</span><span>Pembelian di jurnal Keuangan</span><span>${f0(oc.kPurch)}</span>
      <span class="big">Selisih pembelian</span><span class="big ${oc.flagP ? 'neg' : 'pos'}">${acct(oc.dP)}</span>
      ${oc.sales != null ? `<span>Penjualan Parang-ops</span><span>${f0(oc.sales)}</span><span>Omzet tercatat Keuangan</span><span>${f0(oc.omzet)}</span><span class="big">Selisih omzet</span><span class="big ${oc.flagS ? 'neg' : 'pos'}">${acct(oc.dS)}</span>` : ''}
    </div><p class="note" style="margin-top:6px">${oc.flagP || oc.flagS ? 'Selisih melewati toleransi. Cek nota yang hanya dicatat di satu aplikasi atau beda tanggal. Tutup buku tetap bisa dilanjutkan.' : 'Selisih masih dalam toleransi.'}</p>` : '';
  const reopen = R.BLN > 1 ? `<section class="panel"><h2>Buka kembali ${BULAN[R.BLN - 1]}</h2><p class="hint">Dipakai jika ada koreksi di bulan yang sudah ditutup. Tercatat di riwayat perubahan.</p>
    ${ui.confirmReopen ? `<div class="btns"><span class="note">Yakin membuka kembali ${BULAN[R.BLN - 1]} ${R.Y}?</span><button class="btn danger" data-act="reopen">Ya, buka kembali</button><button class="btn ghost" data-act="reopenno">Batal</button></div>` : `<button class="btn ghost" data-act="reopenask">Buka kembali ${BULAN[R.BLN - 1]} ${R.Y}</button>`}</section>` : '';
  return ['Tutup buku', `Bulan berikutnya: ${BULAN[next - 1]} ${R.Y}`, `<div class="two"><section class="panel"><div class="steps">
    <div class="step"><div><h3>Periksa omzet harian</h3>
      ${days.length ? `<p class="note">${days.length} hari di ${BULAN[next - 1]} belum berstatus OK:</p><div class="daylist">${days.map(r => `<span class="pill ${stClass(r.x.st)}">${tgl(r.d)} · ${r.x.st}</span>`).join('')}</div>
      <label class="check" style="margin-top:8px"><input type="checkbox" id="ack-days" data-ack="days" ${ui.ack.days ? 'checked' : ''}> Saya mengerti dan tetap ingin melanjutkan</label>` : '<p class="note">Semua hari buka berstatus OK.</p>'}</div></div>
    <div class="step"><div><h3>Pastikan tagihan rutin sudah dijurnal</h3><label class="check"><input type="checkbox" id="ack-rutin" data-ack="rutin" ${ui.ack.rutin ? 'checked' : ''}> Gaji, sewa, listrik, air, dan internet bulan ${BULAN[next - 1]} sudah dicatat</label></div></div>
    <div class="step"><div><h3>Isi data setoran PBJT (SSPD)</h3><form class="f" data-form="sspd" data-m="${next}"><fieldset>
      <label class="fld">Omzet dilaporkan<input id="sp-rep" name="rep" class="money" inputmode="numeric" value="${st.reported[next] == null ? '' : f0(st.reported[next])}"></label>
      <label class="fld">PBJT dibayar<input id="sp-paid" name="paid" class="money" inputmode="numeric" value="${st.paid[next] == null ? '' : f0(st.paid[next])}"></label></fieldset>
      <div class="btns"><button class="btn ghost" type="submit">Simpan data SSPD</button></div></form></div></div>
    <div class="step"><div><h3>Salin 3 angka dari Parang-ops</h3><p class="note">Ambil setelah stok opname dan adjustment di Parang-ops selesai. Aplikasi ini tidak terhubung ke Parang-ops, jadi angkanya diketik.</p>
      <form class="f" data-form="ops" data-m="${next}" style="margin-top:8px"><fieldset>
      <label class="fld">Nilai stok akhir (wajib)<input id="op-stock" name="stock" class="money" inputmode="numeric" value="${o.stock == null ? '' : f0(o.stock)}"></label>
      <label class="fld">Total pembelian (wajib)<input id="op-purch" name="purch" class="money" inputmode="numeric" value="${o.purch == null ? '' : f0(o.purch)}"></label>
      <label class="fld">Total penjualan Majoo (opsional)<input id="op-sales" name="sales" class="money" inputmode="numeric" value="${o.sales == null ? '' : f0(o.sales)}"></label></fieldset>
      <div class="btns"><button class="btn ghost" type="submit">Simpan angka Parang-ops</button></div></form>${cmp}</div></div>
    <div class="step"><div><h3>Tutup buku</h3><p class="note">Sistem membuat jurnal otomatis (termasuk penyesuaian persediaan), menjalankan 4 cek kesehatan, lalu mengunci ${BULAN[next - 1]}.</p>
      <div class="btns"><button class="btn" data-act="close" ${ready ? '' : 'disabled'}>Tutup buku ${BULAN[next - 1]} ${R.Y}</button>${ready ? '' : `<span class="note">Belum bisa: ${need.join(', ')}.</span>`}</div></div></div>
  </div></section>
  <div class="grid"><section class="panel"><h2>Jurnal otomatis yang akan dibuat</h2><p class="hint">Bertanggal ${tgl(lastDayStr(next))}. Dihitung dari Omzet Harian, Aset Tetap, data SSPD, dan nilai stok Parang-ops.</p>
    <div class="tw"><table class="t"><thead><tr><th>Debet</th><th>Kredit</th><th class="r">Nominal</th></tr></thead><tbody>
    ${autos.map(j => `<tr><td>${esc(j.deb)}${j.inv ? ' <span class="pill adj">persediaan</span>' : ''}</td><td>${esc(j.kre)}</td><td class="r">${f0(j.nom)}</td></tr>`).join('')}</tbody></table></div>
    ${o.stock == null ? '<p class="note" style="margin-top:8px">Penyesuaian persediaan muncul setelah nilai stok Parang-ops diisi.</p>' : ''}
    <ul class="checks" style="margin-top:14px">${prev.checks.map(c => `<li><span class="dot ${c.ok ? 'ok' : 'bad'}">${c.ok ? '✓' : '!'}</span>${c.label}</li>`).join('')}</ul></section>${reopen}</div></div>
  <div style="margin-top:16px">${opsHistory()}</div>`];
}

/* ---------- events ---------- */
let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }
function refresh() { R = compute(st); render(); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT') return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'nav') { ui.view = v; ui.sel = null; render(); window.scrollTo(0, 0); }
  else if (a === 'role') { ui.role = v; if (v !== 'kasir') ui.pinOk = false; ui.pinErr = ''; render(); }
  else if (a === 'om') { ui.om = +v; ui.sel = null; render(); }
  else if (a === 'day') { ui.sel = v; render(); const p = document.getElementById('daypanel'); if (p && window.innerWidth < 900) p.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  else if (a === 'closeday') { ui.sel = null; render(); }
  else if (a === 'rep') { ui.rep = v; render(); }
  else if (a === 'jnew') { ui.jForm = true; ui.jErr = ''; render(); document.getElementById('j-deb')?.focus(); }
  else if (a === 'jcancel') { ui.jForm = false; ui.jErr = ''; render(); }
  else if (a === 'jmore') { ui.jLimit += 100; render(); }
  else if (a === 'close') { const m = R.BLN + 1; st.bln = m; ui.ack = {}; refresh(); toast(`${BULAN[m - 1]} ${R.Y} ditutup. ${R.checks.every(c => c.ok) ? 'Semua cek kesehatan lolos.' : 'Ada cek yang gagal.'}`); }
  else if (a === 'reopenask') { ui.confirmReopen = true; render(); }
  else if (a === 'reopenno') { ui.confirmReopen = false; render(); }
  else if (a === 'reopen') { const m = R.BLN; st.bln = m - 1; ui.confirmReopen = false; refresh(); toast(`${BULAN[m - 1]} ${R.Y} dibuka kembali.`); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.jf) { ui.jf[t.dataset.jf] = t.value; ui.jLimit = 60; render(); }
  else if (t.dataset.act === 'bb') { ui.bb = t.value; render(); }
  else if (t.dataset.ack) { ui.ack[t.dataset.ack] = t.checked; render(); }
});
let qT;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.jf === 'q') { clearTimeout(qT); qT = setTimeout(() => { ui.jf.q = t.value; ui.jLimit = 60; render(); const q = document.getElementById('jf-q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }, 250); return; }
  const f = t.closest('form[data-form="day"]');
  if (f) { const base = st.daily.find(r => r.d === f.dataset.d); document.getElementById('calc').innerHTML = calcHtml(calcDay({ ...base, ...readForm(f) })); }
});
document.addEventListener('focusout', e => { const t = e.target; if (t.classList && t.classList.contains('money') && !t.disabled) { const v = parseMoney(t.value); t.value = v == null ? '' : f0(v); } });
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.form;
  if (kind === 'day' || kind === 'kasir' || kind === 'setor') {
    const r = st.daily.find(x => x.d === f.dataset.d);
    Object.assign(r, readForm(f));
    refresh(); toast(`Omzet ${tgl(r.d)} tersimpan. Status: ${calcDay(r).st || 'kosong'}.`);
  } else if (kind === 'jurnal') {
    const fd = Object.fromEntries(new FormData(f)), nom = parseMoney(fd.nom), m = +String(fd.date).slice(5, 7);
    let err = '';
    if (!fd.date || String(fd.date).slice(0, 4) !== String(R.Y)) err = `Tanggal harus di tahun buku ${R.Y}.`;
    else if (m <= R.BLN) err = `Bulan ${BULAN[m - 1]} sudah ditutup. Minta owner membuka kembali bulan itu, atau pakai tanggal di bulan berjalan.`;
    else if (!fd.deb || !fd.kre) err = 'Pilih akun debet dan akun kredit.';
    else if (fd.deb === fd.kre) err = 'Akun debet dan akun kredit tidak boleh sama.';
    else if (!nom || nom <= 0) err = 'Nominal harus lebih dari 0.';
    else if (!String(fd.ket).trim()) err = 'Isi keterangan agar transaksi mudah dicari nanti.';
    if (err) { ui.jErr = err; const keep = fd; render(); restoreJ(keep); return; }
    const maxNo = Math.max(...st.journal.map(j => +String(j[0]).replace(/\D/g, '') || 0));
    const no = 'JU-' + String(maxNo + 1).padStart(4, '0');
    st.journal.push([no, fd.date, fd.deb, fd.kre, nom, String(fd.ket).trim(), fd.tag || '', String(fd.sub || '').trim(), String(fd.nota || '').trim()]);
    ui.jForm = false; ui.jErr = ''; refresh(); toast(`Tersimpan sebagai ${no}.`);
  } else if (kind === 'ops') {
    const m = +f.dataset.m, o = readForm(f);
    st.ops[m] = { stock: o.stock, purch: o.purch, sales: o.sales };
    refresh(); toast(`Angka Parang-ops ${BULAN[m - 1]} tersimpan.`);
  } else if (kind === 'pin') {
    const v = new FormData(f).get('pin');
    if (v === DEMO_PIN) { ui.pinOk = true; ui.pinErr = ''; render(); toast('Masuk sebagai kasir.'); }
    else { ui.pinErr = 'PIN salah. Coba lagi.'; render(); document.getElementById('pin')?.focus(); }
  } else if (kind === 'sspd') {
    const m = +f.dataset.m, o = readForm(f);
    st.reported[m] = o.rep; if (o.paid == null) delete st.paid[m]; else st.paid[m] = o.paid;
    refresh(); toast(`Data SSPD ${BULAN[m - 1]} tersimpan.`);
  }
});
function restoreJ(fd) {
  const set = (id, v) => { const el = document.getElementById(id); if (el && v != null) el.value = v; };
  set('j-nota', fd.nota); set('j-date', fd.date); set('j-deb', fd.deb); set('j-kre', fd.kre); set('j-nom', fd.nom); set('j-ket', fd.ket); set('j-tag', fd.tag); set('j-sub', fd.sub);
}

render();
})();

</script>
